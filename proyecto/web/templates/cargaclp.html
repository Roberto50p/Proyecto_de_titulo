

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% comment %} 
    los tags de doctype, html, head, y body son temporales y debenrán desaparecer en su momento
    y ser remplazados por los templates de Django
    {% endcomment %}

<h1>Carga archivos CLP (pueden subir los archivos en cualquier orden)<h1>
<form action="{% url 'cargaclp' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div>
        <label for="Débito">TransBank:</label>
        <input type="file" id="archivo1" name="archivo1"
        accept =".xlsx, .xls, .csv" required>
    </div>

    <div>
        <label for="Credito">TransBank:</label>
        <input type="file" id="archivo2" name="archivo2"
        accept =".xlsx, .xls, .csv" required>
    </div>

    <div>
        <label for="Prepago">TransBank:</label>
        <input type="file" id="archivo3" name="archivo3"
        accept =".xlsx, .xls, .csv" required>
    </div>

    <div>
        <label for="Prepago">Archivo Cartola Banco:</label>
        <input type="file" id="archiv4" name="archivo4"
        accept =".xlsx, .xls, .csv" required>
    </div>

    <div>
        <label for="Prepago">Archivo Bordero:</label>
        <input type="file" id="archivo5" name="archivo5"
        accept =".xlsx, .xls, .csv" required>
    </div>

    <button type="submit">Procesar</button>
</form>
</body>
</html>
