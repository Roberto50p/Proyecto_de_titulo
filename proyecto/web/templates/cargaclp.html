

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% comment %} 
    los tags de doctype, html, head, y body son temporales y debenrán desaparecer en su momento
    y ser remplazados por los templates de Django
    {% endcomment %}

<h1>Carga archivos CLP<h1>
<form action="/subir" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div>
        <label for="Débito">Archivo 1:</label>
        <input type="file" id="archivo_debito" name="archivo1">
    </div>

    <div>
        <label for="Credito">Archivo 2:</label>
        <input type="file" id="archivo_credito" name="archivo2">
    </div>

    <div>
        <label for="Prepago">Archivo 3:</label>
        <input type="file" id="archivo_prepago" name="archivo3">
    </div>

    <button type="submit">Procesar</button>
</form>
</body>
</html>
