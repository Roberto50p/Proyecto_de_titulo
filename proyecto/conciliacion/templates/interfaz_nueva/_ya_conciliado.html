{% for otro in a.ya_conciliado %}<span class="estado-error">Ya conciliado en <a href="{% if otro.conciliacion.estado == 'PROCESADA' %}{% url 'conciliacion:nuevo_detalle' otro.conciliacion.pk %}{% else %}{% url 'conciliacion:nuevo_archivos' otro.conciliacion.pk %}{% endif %}">{{ otro.conciliacion.etiqueta }}</a> ({{ otro.nombre }})</span>{% if not forloop.last %}<br>{% endif %}{% endfor %}
